[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", ".venv-mac-old", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 (line length) is advisory here: a few long prompt strings are clearer unbroken.
ignore = ["E501", "E741"]   # E741: short names like `l` in comprehensions are fine here

[tool.ruff.lint.per-file-ignores]
"scripts/make_sample_data.py" = ["E702"]   # compact PDF-layout statements

[tool.pytest.ini_options]
testpaths = ["tests"]
