name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.4
      - run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # Windows catches encoding / path bugs
    runs-on: ${{ matrix.os }}
    env:
      FINLENS_LLM_PROVIDER: none               # deterministic, no Ollama in CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/make_sample_data.py
      - run: python scripts/ingest.py
      # Unit tests + end-to-end tests + API tests + the 30-question smoke eval that fails
      # the build if faithfulness, numeric EM or abstention drop below target.
      - run: pytest -q
