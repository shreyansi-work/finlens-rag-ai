name: release

# Runs when you push a version tag such as v0.1.0:
#   git tag -a v0.1.0 -m "First public release" && git push origin v0.1.0
# It (1) builds the Docker image and publishes it to GitHub Container Registry (the repo's "Packages"),
# (2) creates the GitHub Release with generated notes (the repo's "Releases"), and
# (3) records the publish as a deployment to the "ghcr" environment (the repo's "Deployments").
# Everything uses the built-in GITHUB_TOKEN: no secrets, no paid services.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # create the release
  packages: write     # push the image to ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: ghcr
      url: https://github.com/${{ github.repository }}/pkgs/container/finlens-rag-ai
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
